[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mwe-build"
version = "0.1.0"
description = "Minimal package with a C extension built by setuptools, for debugging Python.h resolution."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
