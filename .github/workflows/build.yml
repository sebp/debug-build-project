name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Regular
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - run: pip install setuptools build

      - name: Build
        run: python -m build

  build-conda:
    name: Conda
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: '3.15'

      - name: Install packages
        shell: pwsh
        run: conda install setuptools && conda run pip install build

      - name: List packages
        shell: pwsh
        run: |
          conda list
          conda info

      - name: Build
        run: conda run python -m build

